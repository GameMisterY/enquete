{{ define "main" }}
  {{ $base := printf "content/%s" .File.Dir }}

  {{ $background_image := resources.Get "background.png" | fingerprint }}
  {{ $background_image := $background_image.Resize "x4000" }}

  <div class="genially">
      <div style="width: 100%;">
        <div style="position: relative; padding-bottom: 40%; padding-top: 0; height: 0;">
          <iframe title="MisterY" frameborder="0" width="1000" height="400" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src={{.Params.link}} type="text/html" allowscriptaccess="always" allowfullscreen="true" scrolling="yes" allownetworking="all"></iframe>
        </div>
      </div>
  </div>
  <style>
    .genially {
      background-image: url( {{ $background_image.Permalink  }});

      width: 100%;
      background-attachment: fixed;
      background-position: center 0px;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .genially-content {
      color: white;
      font-size: 2rem;
      padding-top: 50px;
    }
  </style>
  <script>
    document.body.classList.add("no-scroll");
  </script>
{{ end }}
