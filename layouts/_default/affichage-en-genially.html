{{ define "main" }}
  {{ $base := printf "content/%s" .File.Dir }}

  {{ $background_image := resources.Get "background.png" | fingerprint }}
  {{ $background_image := $background_image.Resize "x4000" }}

  {{ $show_sidebar := not (eq .Params.sidebar false) }}

  <div class="genially">
    <iframe id="genially-iframe" title="MisterY" frameborder="0" width="1000" height="400" style="top: 0px; left: 0; width: 100%; height: 100%;" src={{.Params.link}} type="text/html" allowscriptaccess="always" allowfullscreen="true" scrolling="yes" allownetworking="all"></iframe>
  </div>
  <style>
    .genially {
      background-image: url( {{ $background_image.Permalink  }});
      /*width: 100%;*/
      background-attachment: fixed;
      background-position: center 0px;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      /*justify-content: center;*/
      {{ if $show_sidebar }}
        padding-left: 20rem;
      {{ end }}
    }
    .genially-content {
      color: white;
      font-size: 2rem;
      padding-top: 50px;
    }
    @media (max-width: 500px) {
      .genially {
        padding-left: 0rem;
      }
    }
  </style>
  <script>
    document.body.classList.add("no-scroll");

    function updateIframeStyle() {
      const header = document.querySelector('.header');
      const iframe = document.querySelector('#genially-iframe');

      if (!header || !iframe) {
        return;
      }

      const headerHeight = header.offsetHeight;
      const remainingHeight = window.innerHeight - headerHeight;

      iframe.style.top = `${headerHeight}px`;
      iframe.style.height = `${remainingHeight}px`;
    }

    document.addEventListener('DOMContentLoaded', updateIframeStyle);
    window.addEventListener('resize', updateIframeStyle);
   </script>
{{ end }}
